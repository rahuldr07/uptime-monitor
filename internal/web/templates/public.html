{{define "layout"}}<!doctype html>
<html lang="en"{{if .Theme}} data-theme="{{.Theme}}"{{end}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="{{asset "app.css"}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='{{if gt .DownCount 0}}%23e06c75{{else}}%237fd88f{{end}}'/%3E%3C/svg%3E">
<script defer src="{{asset "app.js"}}"></script>
</head>
<body{{if .Admin}} data-live{{end}}>
{{template "sprite"}}
<div class="status-wrap">
{{with .Flash}}<div data-flash>{{.}}</div>{{end}}
{{with .Error}}<div class="alert error" role="alert"><svg class="ic"><use href="#i-alert"/></svg><div>{{.}}</div></div>{{end}}
<div id="content"{{if .Error}} data-no-refresh{{end}}>{{template "content" .}}</div>
</div>
<div class="toasts"></div>
</body>
</html>{{end}}
