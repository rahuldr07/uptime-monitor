{{define "content"}}
<div class="login">
  <div class="card">
    {{template "auth-error" .}}
    <h1>{{if .Choose}}Choose a password{{else}}Reset password{{end}}</h1>
    {{if and .Choose .Token .Methods}}<p class="muted small">You can still sign in with {{.Methods}}.</p>{{end}}
    {{if .Token}}
    <form method="post" action="/reset">
      <input type="hidden" name="token" value="{{.Token}}">
      <div class="field"><label for="rs-new">New password</label><input id="rs-new" name="password" type="password" autofocus required minlength="10" autocomplete="new-password"></div>
      <div class="field"><label for="rs-confirm">Confirm new password</label><input id="rs-confirm" name="confirm" type="password" data-match="password" required minlength="10" autocomplete="new-password"></div>
      <div style="margin-top:14px"><button type="submit" class="primary">Set password</button></div>
    </form>
    {{else}}
    <p class="muted" style="margin:8px 0 0"><a href="/login">Back to sign in</a></p>
    {{end}}
  </div>
</div>
{{end}}
