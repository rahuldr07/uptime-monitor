{{define "content"}}
<div class="login">
  <div class="card">
    {{template "auth-error" .}}
    <h1>Reset password</h1>
    {{if .Token}}
    <form method="post" action="/reset">
      <input type="hidden" name="token" value="{{.Token}}">
      <div class="field"><label>New password</label><input name="password" type="password" autofocus required minlength="10" autocomplete="new-password"></div>
      <div class="field"><label>Confirm new password</label><input name="confirm" type="password" data-match="password" required minlength="10" autocomplete="new-password"></div>
      <div style="margin-top:14px"><button type="submit" class="primary">Set password</button></div>
    </form>
    {{else}}
    <p class="muted" style="margin:8px 0 0"><a href="/login">Back to sign in</a></p>
    {{end}}
  </div>
</div>
{{end}}
