{{define "content"}}
<div class="login">
  <div class="card">
    <h1>Sign in</h1>
    <p class="muted small" style="margin:4px 0 16px">Sign in to manage monitors and alerts. The <a href="/status">status page</a> is public.</p>
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{.Next}}">
      <div class="field"><label>Email</label><input name="email" type="email" value="{{.Email}}" autofocus required autocomplete="username"></div>
      <div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div>
      <div style="margin-top:14px"><button type="submit" class="primary">Sign in</button></div>
    </form>
    {{if eq .SignupMode "invite"}}<p class="muted small" style="margin:14px 0 0">Have an invitation link? Open it to sign up.</p>{{end}}
  </div>
</div>
{{end}}
