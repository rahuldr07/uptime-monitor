services:
  uptime:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      UPTIME_ADMIN_PASSWORD: ${UPTIME_ADMIN_PASSWORD:-change-me}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped
